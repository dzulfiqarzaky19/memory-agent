services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memory-agent-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: memory_agent
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Small local embedder (MiniLM 384-d). Free, no LM Studio.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: memory-agent-embeddings
    restart: unless-stopped
    command: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2", "--port", "80"]
    volumes:
      - tei-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    build: .
    container_name: memory-agent-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # In-docker DSN + embed sidecar. LLM_* stay from .env only.
      # MEMORY_API_SECRET / MEMORY_ALLOW_RELOAD come from env_file (.env).
      DATABASE_URL: postgresql://postgres:localdev@db:5432/memory_agent
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://embeddings:80/v1
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: "384"
      EMBEDDING_SEND_DIMENSIONS: "false"
      MEMORY_BIND_HOST: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_healthy

volumes:
  pgdata:
  tei-data:
